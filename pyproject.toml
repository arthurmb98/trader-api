[project]
name = "trader-api"
version = "2.0.0"
description = "Day-trade signal engine for mini índice (WIN)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "pyyaml>=6.0.0",
  "joblib>=1.4.0",
  "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
